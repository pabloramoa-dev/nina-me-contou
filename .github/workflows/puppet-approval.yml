name: Nina puppet experimental approval
on:
  push:
    branches: [experimento/nina-gestos-2d]
    paths: ['.github/workflows/puppet-approval.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NINA_VOICE_FALLBACK: 'false'
      NINA_VOICE_ENGINE: 'thalita'
      NINA_PUPPET_TEST: '1'
      NINA_AUTO_VISUAL_IMAGES: '0'
      NINA_FOTOS: '0'
      NINA_DIRECAO: '1'
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /.github/
            /assets/
            /motor/
            /src/
            /tests/
            /tools/
            /video/
            /visual_tests/
            /requirements-estudio.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-estudio.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg pkg-config libcairo2-dev libpango1.0-dev espeak-ng fonts-dejavu-core
      - run: pip install -r requirements-estudio.txt pytest && pip install edge-tts==7.3.1
      - uses: ./.github/actions/setup-hyperframes
      - run: env -u NINA_AUTO_VISUAL_IMAGES -u NINA_FOTOS python -m pytest -q tests
      - name: Prepare isolated episode
        run: |
          python tools/teste_hyperframes.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('saida/teste-hf.json')
          e=json.loads(p.read_text())
          falas=[
          'Menina, a vizinha levantou a mão no meio da reunião e soltou: tem alguém roubando minhas encomendas!',
          'Apontou para o síndico e balançou a cabeça. Ele abriu os braços: eu nem estava aqui!',
          'Ela se inclinou para olhar o celular. Tinha chegado uma foto do porteiro, mostrando uma caixa aberta.',
          'A mulher arregalou os olhos. Dentro da caixa estava o vestido vermelho que ela comprou escondido do marido!',
          'Só que ninguém tinha roubado nada. Ela mesma mandou entregar na casa da mãe e esqueceu!',
          'Baixou a cabeça, deu aquela risadinha e saiu de fininho. E você, já acusou alguém antes de conferir?'
          ]
          artes=[['conversa'],['conversa'],['conversa'],['presente'],['porta'],['conversa']]
          for b,f,arte in zip(e['batidas'],falas,artes):
              b['fala']=f
              b['arte']=arte
          e['titulo']='A ENCOMENDA SUMIDA'
          e['fim']='JÁ PASSOU ESSA VERGONHA?'
          p.write_text(json.dumps(e,ensure_ascii=False))
          PY
      - name: Render original Nina with Thalita and HyperFrames
        run: |
          python motor/produzir.py saida/teste-hf.json
          node video/validate-layout.mjs saida/teste-hf/hyperframes
          mkdir -p out
          cp saida/teste-hf/teste-hf.mp4 out/Nina-Gestos-Amplos-V2.mp4
          cp saida/teste-hf/render.json out/
          cp saida/teste-hf/direcao.json out/
          cp saida/teste-hf/qualidade.json out/
          ffprobe -v error -show_streams -show_format -of json out/Nina-Gestos-Amplos-V2.mp4 > out/probe.json
          ffmpeg -v error -i out/Nina-Gestos-Amplos-V2.mp4 -vf fps=1/3,scale=360:-2 out/check-%02d.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nina-puppet-approval
          path: |
            out/
            saida/teste-hf/render.json
            saida/teste-hf/qualidade.json
            saida/teste-hf/hyperframes/layout-check.json
          retention-days: 7

# validation pass: dynamic silhouette
