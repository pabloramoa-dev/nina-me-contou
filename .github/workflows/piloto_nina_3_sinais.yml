name: Nina — piloto original de 3 sinais
# Ensaiar no pipeline oficial, usando a Nina, voz Kokoro Dora, HyperFrames,
# Remotion e exatamente 10 imagens SiliconFlow. NÃO PUBLICAR.
on:
  pull_request:
    paths:
      - '.github/workflows/piloto_nina_3_sinais.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nina-piloto-original-3-sinais
  cancel-in-progress: false

jobs:
  renderizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/
            /assets/
            /avulsos/nina-teste-3-sinais-amizade-20261111.json
            /motor/
            /src/
            /video/
            /tools/
            /requirements-estudio.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-estudio.txt
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libcairo2-dev libpango1.0-dev espeak-ng fonts-dejavu-core
          mkdir -p ~/.fonts
          for p in Bold Regular; do
            curl -sSL -o ~/.fonts/Poppins-$p.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$p.ttf"
          done
          fc-cache -f
      - name: Instalar dependências Python
        run: |
          SETUPTOOLS_USE_DISTUTILS=stdlib pip install --no-build-isolation srt || true
          pip install -r requirements-estudio.txt
      - uses: ./.github/actions/setup-hyperframes
      - name: Reutilizar cache oficial da voz Kokoro
        uses: actions/cache@v4
        with:
          path: ~/.cache/dvh_kokoro
          key: ${{ runner.os }}-${{ runner.arch }}-cache-kokoro-nina-v1
      - name: Renderizar com os motores originais (SEM publicar)
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NINA_ALLOW_PAID_IMAGE_API: '1'
          NINA_REQUIRE_SILICONFLOW: '1'
          NINA_REQUIRE_STORED_PROMPTS: '1'
          NINA_REQUIRE_AI_STORYBOARD: '0'
          NINA_USE_AI_STORYBOARD: '0'
          NINA_STORYBOARD_PROVIDER: 'siliconflow'
          NINA_TARGET_IMAGES: '10'
          NINA_MAX_IMAGES: '10'
          NINA_IMAGE_RETRIES: '2'
          NINA_MOTOR: 'hyperframes'
          NINA_FINAL_COMPOSITOR: 'remotion'
          NINA_VOICE_ENGINE: 'kokoro'
          NINA_KOKORO_VOICE: 'pf_dora'
          NINA_KOKORO_SPEED: '0.94'
          NINA_MAX_DUR: '59'
        run: |
          # Banco local determinístico: âncoras literais por fala, 10 cenas.
          # O render oficial segue obrigando exatamente 10 imagens SiliconFlow.
          python tools/preparar_banco_prompts.py
          python motor/produzir.py avulsos/nina-teste-3-sinais-amizade-20261111.json
          python - <<'PY'
          import json, subprocess
          from motor.siliconflow_policy import validar_metadados
          p = 'saida/nina-teste-3-sinais-amizade-20261111'
          with open(f'{p}/render.json',encoding='utf-8') as f:
              meta = json.load(f)
          validar_metadados(meta)
          assert meta['motor'] == 'remotion', meta.get('motor')
          output = f'{p}/nina-teste-3-sinais-amizade-20261111.mp4'
          duration = float(subprocess.check_output(
              ['ffprobe','-v','error','-show_entries','format=duration',
               '-of','default=noprint_wrappers=1:nokey=1',output],text=True).strip())
          print('Duração original Nina:', duration, 'segundos')
          if not 15 <= duration < 60:
              raise ValueError(f'Piloto fora do limite de menos de 60 segundos: {duration:.1f}s')
          print('PASSOU: Nina original + voz, HyperFrames, Remotion, 10 imagens SiliconFlow.')
          PY
      - name: Entregar MP4 oficial, sem postar
        uses: actions/upload-artifact@v4
        with:
          name: nina-original-3-sinais-piloto-mp4
          path: |
            saida/nina-teste-3-sinais-amizade-20261111/nina-teste-3-sinais-amizade-20261111.mp4
            saida/nina-teste-3-sinais-amizade-20261111/render.json
            saida/nina-teste-3-sinais-amizade-20261111/legenda.txt
          retention-days: 3
