name: Publicar Reel

on:
  # 4 vídeos por dia, em sequência (parte 1 → parte 2 → próximo episódio).
  # 8h e 20h também vão pros Stories. Minuto 7 = fora do pico do GitHub (menos atraso).
  schedule:
    - cron: "7 11 * * *"    # 08:07 Brasília — Reel + Story
    - cron: "7 15 * * *"    # 12:07 Brasília — Reel
    - cron: "7 19 * * *"    # 16:07 Brasília — Reel
    - cron: "7 23 * * *"    # 20:07 Brasília — Reel + Story
  workflow_dispatch:
    inputs:
      horario:
        description: "manha/noite = Reel + Story · almoco/tarde = só Reel"
        type: choice
        options: [manha, almoco, tarde, noite]
        default: almoco
      dry_run:
        description: "Ensaio: valida tudo e NÃO publica"
        type: boolean
        default: true

concurrency:
  group: nina-publicacao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt

      - name: Qual horário?
        id: h
        run: |
          case "${{ inputs.horario || github.event.schedule }}" in
            manha|"7 11 * * *")  h=manha ;;
            almoco|"7 15 * * *") h=almoco ;;
            tarde|"7 19 * * *")  h=tarde ;;
            *)                   h=noite ;;
          esac
          echo "h=$h" >> $GITHUB_OUTPUT

      - name: Publicar
        env:
          IG_USER_ID_NINA: ${{ secrets.IG_USER_ID_NINA }}
          IG_ACCESS_TOKEN_NINA: ${{ secrets.IG_ACCESS_TOKEN_NINA }}
          RAW_BASE_URL: ${{ vars.RAW_BASE_URL }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          PUBLICAR_ATIVO: ${{ vars.PUBLICAR_ATIVO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || 'false' }}
        run: python -m src.publicar --horario ${{ steps.h.outputs.h }}

      - name: Registrar no histórico
        if: success()
        run: |
          git config user.name "nina-bot"
          git config user.email "actions@github.com"
          git add conteudo/publicados.json
          git diff --cached --quiet && exit 0
          git commit -m "publicado: ${{ steps.h.outputs.h }} [skip ci]"
          git pull --rebase
          git push
