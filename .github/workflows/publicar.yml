name: Publicar Reel

on:
  # Meta: 3 Reels por dia em Brasilia: 9h longo, 12h e 15h curtos.
  # Tentativas extras recuperam horarios perdidos; o ledger impede duplicatas.
  # Horarios abaixo em UTC; os comentarios indicam Brasilia (UTC-3).
  schedule:
    - cron: "7,37 12,15,18 * * *"  # 09:07/09:37, 12:07/12:37, 15:07/15:37 BRT
    - cron: "7 14,17,19,21,23 * * *"  # 11:07, 14:07, 16:07, 18:07, 20:07 BRT
    - cron: "37 2 * * *"             # 23:37 BRT (ultima tentativa do dia)
  workflow_dispatch:
    inputs:
      horario:
        description: "manha = Reel + Story 9h; almoco = 12h; tarde = 15h"
        type: choice
        options: [manha, almoco, tarde]
        default: almoco
      dry_run:
        description: "Ensaio: valida tudo e NÃO publica"
        type: boolean
        default: true

concurrency:
  group: nina-publicacao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt

      - name: Qual horário?
        id: h
        run: |
          case "${{ inputs.horario || 'almoco' }}" in
            manha)   h=manha ;;
            tarde)   h=tarde ;;
            *)       h=almoco ;;
          esac
          echo "h=$h" >> $GITHUB_OUTPUT

      - name: Publicar
        env:
          IG_USER_ID_NINA: ${{ secrets.IG_USER_ID_NINA }}
          IG_ACCESS_TOKEN_NINA: ${{ secrets.IG_ACCESS_TOKEN_NINA }}
          RAW_BASE_URL: ${{ vars.RAW_BASE_URL }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          PUBLICAR_ATIVO: ${{ vars.PUBLICAR_ATIVO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python tools/recuperar_publicacoes.py
          else
            python -m src.publicar --horario "${{ steps.h.outputs.h }}"
          fi

      - name: Registrar no histórico
        if: always()
        run: |
          git config user.name "nina-bot"
          git config user.email "actions@github.com"
          if [ -f conteudo/send_receipts.json ]; then git add conteudo/send_receipts.json; fi
          git add conteudo/publicados.json
          git diff --cached --quiet && exit 0
          git commit -m "publicado: ${{ steps.h.outputs.h }} [skip ci]"
          git pull --rebase
          git push

      - name: Limpar mídia já consumida e excesso de buffer
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          python motor/limpar_reels.py --alvo 8
          git config user.name "nina-bot"
          git config user.email "actions@github.com"
          git add -A reels/
          if git diff --cached --quiet; then
            echo "Nenhuma mídia para limpar."
            exit 0
          fi
          git commit -m "limpeza: mídia já publicada da Nina [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
