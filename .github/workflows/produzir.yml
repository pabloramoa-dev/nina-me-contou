name: Produzir episódios

# Renderiza todo episódio de episodios/ que ainda não tem MP4 em reels/ (ou que
# teve o roteiro/versão de render editado depois do render) e grava MP4 + capa + versão Story.
# Cada história completa (~3 min) roda numa máquina própria. Nada é publicado aqui.
# Todo vídeo sai com o CTA de seguir no FINAL (motor/cta.py).
# Voz principal: Kokoro Dora pf_dora (local, conforme teste aprovado).
# Visual final: Remotion, legendas leves embaixo; Nina e lip sync originais.

on:
  push:
    branches: [main]
    paths: ["episodios/**", "motor/**", "src/fila.py", "video/**", ".github/actions/setup-hyperframes/**", ".github/workflows/produzir.yml", "requirements-estudio.txt"]
  schedule:
    - cron: "40 4,10,16,22 * * *"    # Repor estoque e repetir renders pendentes ao longo do dia
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de vídeos únicos a renderizar nesta execução"
        default: "8"

concurrency:
  group: nina-estudio-v2
  # Renders em andamento devem terminar antes da próxima tentativa.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  abastecer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            episodios
            avulsos
            avulsos_fast
            motor
            tools
            tests
            conteudo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Garantir 30 dias de roteiros
        run: |
          pip install -q requests pillow
          python -m unittest discover -s tests -p test_ganchos.py -v
          python -m unittest discover -s tests -p test_episodio_unico.py -v
          python -m unittest discover -s tests -p test_revisar_historias.py -v
          python -m unittest discover -s tests -p test_listas_virais.py -v
          python motor/revisar_historias.py --aplicar > /tmp/revisao-nina.json
          python -c "import json; d=json.load(open('/tmp/revisao-nina.json')); print('Revisão Nina:',d['total'],'roteiros analisados,',d['revisados'],'revisados,',len(d['revisao_manual']),'pendências manuais')"
          python motor/normalizar_ganchos.py
          python motor/gerar_roteiros.py --alvo 60
          python motor/listas_virais.py --dias 10
          # Roteiro novo sem os 10 prompts trava o render: recompila o banco
          # (prompts manuais em motor/prompts_episodios/ têm prioridade).
          python tools/preparar_banco_prompts.py > /tmp/banco.json
          python -c "import json;d=json.load(open('/tmp/banco.json'));print('banco:',d['roteiros'],'roteiros,',d['manuais'],'manuais,',len(d['bloqueados']),'bloqueados')"
      - name: Persistir a reserva anual
        run: |
          git config user.name "nina-bot"
          git config user.email "actions@github.com"
          git add episodios/ avulsos/ avulsos_fast/ conteudo/geracao_anual.json motor/prompts_banco.json
          if git diff --cached --quiet; then
            echo "Reserva de roteiros já está no alvo."
            exit 0
          fi
          # [skip ci] evita abrir uma segunda execução: esta mesma execução
          # continua abaixo e renderiza os roteiros recém-gravados.
          git commit -m "roteiros: reserva anual da Nina [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1

  listar:
    needs: abastecer
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.l.outputs.lista }}
      qtd: ${{ steps.l.outputs.qtd }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a main mais nova: não refaz o que outra rodada já gravou
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: l
        run: |
          pip install -q requests pillow
          LIM="${{ inputs.limite || '8' }}"
          python motor/pendentes.py --rel --alvo-prontos 8 --limite "$LIM" > /tmp/p.txt
          cat /tmp/p.txt
          echo "lista=$(python -c "import json;print(json.dumps(open('/tmp/p.txt').read().split()))")" >> $GITHUB_OUTPUT
          echo "qtd=$(wc -l < /tmp/p.txt)" >> $GITHUB_OUTPUT

  renderizar:
    needs: listar
    if: needs.listar.outputs.qtd != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        episodio: ${{ fromJson(needs.listar.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libcairo2-dev libpango1.0-dev espeak-ng fonts-dejavu-core
          mkdir -p ~/.fonts
          for p in Bold Regular; do
            curl -sSL -o ~/.fonts/Poppins-$p.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$p.ttf"
          done
          fc-cache -f

      - name: Pacotes Python
        run: |
          SETUPTOOLS_USE_DISTUTILS=stdlib pip install --no-build-isolation srt || true
          pip install -r requirements-estudio.txt

      - uses: ./.github/actions/setup-hyperframes
      - name: Cache da voz local de contingência
        uses: actions/cache@v4
        with:
          path: ~/.cache/dvh_kokoro
          key: ${{ runner.os }}-${{ runner.arch }}-cache-kokoro-nina-v1

      - name: Renderizar
        id: r
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          NINA_ALLOW_PAID_IMAGE_API: '1'
          NINA_REQUIRE_SILICONFLOW: '1'  # Instagram: bloqueia qualquer imagem local
          NINA_REQUIRE_STORED_PROMPTS: "1"
          NINA_STORYBOARD_PROVIDER: 'siliconflow'
          NINA_STORYBOARD_MODEL: 'Qwen/Qwen3-30B-A3B-Instruct-2507'
          NINA_IMAGE_RETRIES: '2'   # erro 5xx/429 passageiro não pode derrubar o episódio inteiro
          NINA_TARGET_IMAGES: '10'
          NINA_MAX_IMAGES: '10'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # opcional (fotos "banco"); sem ela usa Openverse CC0
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }} # opcional
        run: |
          python motor/produzir.py "${{ matrix.episodio }}" --publicar-em saida_reels
          echo "id=$(basename '${{ matrix.episodio }}' .json)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.r.outputs.id }}
          path: saida_reels/
          retention-days: 7

  gravar:
    needs: renderizar
    if: always() && needs.renderizar.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: reel-*
          merge-multiple: true
          path: entrega_nina/
      - name: Copiar os MP4s recém-renderizados para a fila
        run: |
          mkdir -p reels/
          cp -a entrega_nina/. reels/
      - name: Conferir a fila
        run: python -m src.fila || true
      - name: Gravar no repositório sem conflito com publicações simultâneas
        run: |
          git config user.name "nina-bot"
          git config user.email "actions@github.com"
          # Guarde os artifacts em entrega_nina/ (fora do Git). Em cada tentativa,
          # atualize a main primeiro, revalide a versão e SÓ ENTÃO aplique os MP4s.
          # Evita conflitos de rebase e não restaura mídia já publicada/limpa.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path
          from src.fila import assinatura, ja_publicado
          from motor.siliconflow_policy import validar_metadados
          origem = Path("entrega_nina")
          destino = Path("reels")
          destino.mkdir(exist_ok=True)
          gravados = []
          for mp4 in sorted(origem.glob("ep*.mp4")):
              ep_id = mp4.stem
              if not re.fullmatch(r"ep\d{3,}", ep_id):
                  continue
              render = origem / (ep_id + "-render.json")
              hashfile = origem / (ep_id + ".hash")
              capa = origem / (ep_id + "-capa.jpg")
              if not (render.exists() and hashfile.exists() and capa.exists()):
                  raise RuntimeError(f"{ep_id}: artifact sem manifesto, hash ou capa")
              if ja_publicado(ep_id) or hashfile.read_text().strip() != assinatura(ep_id):
                  print(f"Ignorando {ep_id}: publicado ou versão anterior")
                  continue
              validar_metadados(json.loads(render.read_text(encoding="utf-8")))
              for arq in origem.iterdir():
                  if arq.is_file() and (arq.name.startswith(ep_id + ".") or arq.name.startswith(ep_id + "-")):
                      shutil.copy2(arq, destino / arq.name)
              gravados.append(ep_id)
          print("Episódios SiliconFlow preparados:", gravados)
          PY
            git add reels/
            if git diff --cached --quiet; then
              echo "Nenhuma mídia nova válida para registrar."
              exit 0
            fi
            git commit -m "estúdio: episódios renderizados [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Main mudou durante a gravação; reaplicando artifacts no HEAD atual."
            sleep 5
          done
          exit 1
