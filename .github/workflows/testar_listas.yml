name: Validar Nina Listas Curtas
on:
  pull_request:
    paths:
      - 'motor/listas_virais.py'
      - 'motor/antecipacao.py'
      - 'motor/cta.py'
      - 'src/**'
      - 'tools/recuperar_publicacoes.py'
      - '.github/workflows/testar_listas.yml'
      - 'tests/test_listas_virais.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe
        run: python -m compileall -q motor/listas_virais.py motor/antecipacao.py motor/cta.py motor/pendentes.py src/fila.py src/publicar.py tools/recuperar_publicacoes.py
      - name: Testar listas
        run: python -m unittest discover -s tests -p test_listas_virais.py -v
