name: Produzir vídeo avulso
# v2: checkout leve após poda do estoque de mídia

# Vídeos AVULSOS da Nina, feitos sob demanda (fora da fila automática do Instagram).
# Roteiro em avulsos/<id>.json  ->  MP4 + capa + Story + prévia 720p + legenda em avulsos_prontos/.
# NADA aqui é publicado: o Pablo baixa e posta onde quiser (TikTok, Reels manual etc.).
# Para entrar na fila automática, o roteiro vai em episodios/ (par p1/p2), não aqui.

on:
  push:
    branches: [main]
    paths: ["avulsos/**.json", "motor/produzir.py", "motor/gerar_voz_thalita.py", "motor/gerar_voz_kokoro.py", ".github/workflows/avulso.yml"]
  workflow_dispatch:

concurrency:
  group: nina-avulso-v2
  # Cada execução lista TODOS os avulsos ainda sem saída válida. Se uma versão
  # mais nova do motor chega, cancela a antiga e reprocessa o conjunto pendente.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.l.outputs.lista }}
      qtd: ${{ steps.l.outputs.qtd }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/
            /assets/
            /avulsos/
            /avulsos_prontos/
            /conteudo/tiktok_metricool/
            /motor/
            /src/
            /video/
            /requirements-estudio.txt
          sparse-checkout-cone-mode: false
      - id: l
        run: |
          python3 - <<'PY' > /tmp/p.txt
          import glob, hashlib, os, sys
          sys.path.insert(0, "motor")
          from render_version import versao
          import json
          for f in sorted(glob.glob("avulsos/*.json")):
              i = os.path.splitext(os.path.basename(f))[0]
              registro = f"conteudo/tiktok_metricool/{i}.json"
              if os.path.exists(registro):
                  try:
                      info = json.load(open(registro, encoding="utf-8"))
                      if info.get("mediaUrl"):
                          continue
                  except Exception:
                      pass
              h = hashlib.sha1(open(f, "rb").read() + versao().encode()).hexdigest()[:16]
              feito = f"avulsos_prontos/{i}.hash"
              if not (os.path.exists(f"avulsos_prontos/{i}.mp4") and os.path.exists(feito) and open(feito).read().strip() == h):
                  print(f)
          PY
          cat /tmp/p.txt
          echo "lista=$(python3 -c "import json;print(json.dumps(open('/tmp/p.txt').read().split()))")" >> $GITHUB_OUTPUT
          echo "qtd=$(wc -l < /tmp/p.txt)" >> $GITHUB_OUTPUT

  renderizar:
    needs: listar
    if: needs.listar.outputs.qtd != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        roteiro: ${{ fromJson(needs.listar.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/
            /assets/
            /avulsos/
            /avulsos_prontos/
            /conteudo/tiktok_metricool/
            /motor/
            /src/
            /video/
            /requirements-estudio.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-estudio.txt
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libcairo2-dev libpango1.0-dev espeak-ng fonts-dejavu-core
          mkdir -p ~/.fonts
          for p in Bold Regular; do
            curl -sSL -o ~/.fonts/Poppins-$p.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$p.ttf"
          done
          fc-cache -f
      - name: Pacotes Python
        run: |
          SETUPTOOLS_USE_DISTUTILS=stdlib pip install --no-build-isolation srt || true
          pip install -r requirements-estudio.txt
      - uses: ./.github/actions/setup-hyperframes
      - name: Cache da voz local de contingência
        uses: actions/cache@v4
        with:
          path: ~/.cache/dvh_kokoro
          key: ${{ runner.os }}-${{ runner.arch }}-cache-kokoro-nina-v1
      - name: Renderizar
        id: r
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NINA_MAX_DUR: "180"
        run: |
          F="${{ matrix.roteiro }}"; ID=$(basename "$F" .json)
          python motor/produzir.py "$F"
          mkdir -p out
          cp "saida/$ID/$ID.mp4" "out/$ID.mp4"
          python -c "from PIL import Image;Image.open('saida/$ID/capa.png').convert('RGB').save('out/$ID-capa.jpg',quality=90)"
          python motor/story.py "out/$ID.mp4" "out/$ID-story.mp4"
          ffmpeg -v error -y -i "out/$ID.mp4" -vf scale=720:-2 -c:v libx264 -crf 26 -preset medium -c:a aac -b:a 128k -movflags +faststart "out/$ID-720p.mp4"
          cp "saida/$ID/legenda.txt" "out/$ID-legenda.txt"
          [ -f "saida/$ID/fotos.json" ] && cp "saida/$ID/fotos.json" "out/$ID-fotos.json" || true
          python3 -c "import hashlib,sys;sys.path.insert(0,'motor');from render_version import versao;print(hashlib.sha1(open('$F','rb').read()+versao().encode()).hexdigest()[:16])" > "out/$ID.hash"
          echo "id=$ID" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: avulso-${{ steps.r.outputs.id }}
          path: out/
          retention-days: 1

  gravar:
    needs: renderizar
    if: always() && needs.renderizar.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      # O job começa depois dos renders; use o HEAD atual para não tentar
      # rebasear commits binários produzidos a partir de um SHA antigo.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/
            /assets/
            /avulsos/
            /avulsos_prontos/
            /conteudo/tiktok_metricool/
            /motor/
            /src/
            /video/
            /requirements-estudio.txt
          sparse-checkout-cone-mode: false
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: avulso-*
          merge-multiple: true
          path: avulsos_prontos/
      - name: Preparar FFmpeg para compactar vídeos grandes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Gravar somente o necessário no repositório
        run: |
          # A versão principal é usada como URL temporária para o agendamento.
          # Story, prévia 720p, capa e fotos continuam disponíveis no artifact por 1 dia,
          # mas não entram no Git e não aumentam o tamanho do repositório.
          find avulsos_prontos -type f \( -name '*-story.mp4' -o -name '*-720p.mp4' -o -name '*-capa.jpg' -o -name '*-fotos.json' \) -delete
          # GitHub rejeita arquivos acima de 100 MiB: comprimir MP4 grande antes do commit.
          # Manter resolução 1080x1920 quando possível, com alvo seguro de 85 MiB.
          for f in avulsos_prontos/*.mp4; do
            [ -f "$f" ] || continue
            size=$(stat -c '%s' "$f")
            [ "$size" -le 99614720 ] && continue
            duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f")
            rate=$(python3 -c "import sys; d=float(sys.argv[1]); print(max(800,int(85*1024*1024*8/d/1000-160)))" "$duration")
            echo "Compactando $f ($size bytes) para não exceder limite do GitHub; video ${rate}k"
            ffmpeg -hide_banner -loglevel error -y -i "$f" -map 0:v:0 -map 0:a:0 -c:v libx264 -preset veryfast -b:v "${rate}k" -maxrate "${rate}k" -bufsize "$((rate*2))k" -c:a aac -b:a 128k -movflags +faststart "${f%.mp4}.compact.mp4"
            newsize=$(stat -c '%s' "${f%.mp4}.compact.mp4")
            if [ "$newsize" -gt 99614720 ]; then
              # Fallback garantido para postagem: resolução 720p em vez de perder o vídeo.
              ffmpeg -hide_banner -loglevel error -y -i "$f" -vf 'scale=720:-2' -c:v libx264 -preset veryfast -crf 26 -c:a aac -b:a 128k -movflags +faststart "${f%.mp4}.fallback.mp4"
              mv "${f%.mp4}.fallback.mp4" "${f%.mp4}.compact.mp4"
              newsize=$(stat -c '%s' "${f%.mp4}.compact.mp4")
            fi
            [ "$newsize" -le 99614720 ] || { echo "MP4 continua maior que 95 MiB"; exit 1; }
            mv "${f%.mp4}.compact.mp4" "$f"
          done
          git config user.name "nina-bot"
          git config user.email "actions@github.com"
          git add avulsos_prontos/
          git diff --cached --quiet && exit 0
          git commit -m "estúdio: vídeo avulso temporário [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

