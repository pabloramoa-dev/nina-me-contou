name: Validar Nina HyperFrames
on:
  push:
    branches: [main, feature/hyperframes-production, lab/nina-direcao-gratuita-v1]
    paths: ['motor/**', 'src/fila.py', 'video/**', 'tests/**', 'tools/teste_hyperframes.py', '.github/**', 'requirements-estudio.txt']
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: nina-hyperframes-v2
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/
            /assets/
            /motor/
            /src/
            /tests/
            /tools/
            /video/
            /visual_tests/
            /requirements-estudio.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg   # cadeia de áudio reserva (máquinas sem Pedalboard)
      - run: pip install requests pytest numpy Pillow soundfile edge-tts==7.2.8 pedalboard==0.9.25
      - run: python -m pytest -q tests
      - run: python -m compileall -q motor src tools/teste_hyperframes.py
  render:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/
            /assets/
            /motor/
            /src/
            /tests/
            /tools/
            /video/
            /visual_tests/
            /requirements-estudio.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg pkg-config libcairo2-dev libpango1.0-dev espeak-ng fonts-dejavu-core
      - run: pip install -r requirements-estudio.txt
      - uses: ./.github/actions/setup-hyperframes
      - name: Gerar vídeo, capa e Story com Thalita sem publicar
        env:
          OPENAI_API_KEY: ''
          NINA_AUTO_VISUAL_IMAGES: '0'
          NINA_FOTOS: '0'
          NINA_DIRECAO: '1'
        run: |
          python tools/teste_hyperframes.py
          python motor/produzir.py saida/teste-hf.json
          python motor/story.py saida/teste-hf/teste-hf.mp4 saida/teste-hf/story.mp4
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'motor')
          from hyperframes import conferir
          from story import duracao
          p=Path('saida/teste-hf')
          info=json.loads((p/'render.json').read_text())
          conferir(p/'teste-hf.mp4',info['duracao'])
          assert info['motor']=='hyperframes'
          assert (p/'capa.png').stat().st_size>10000
          assert duracao(str(p/'story.mp4'))<=59.1
          assert (p/'voz.wav').stat().st_size>10000
          plano=json.loads((p/'direcao.json').read_text())
          qa=json.loads((p/'qualidade.json').read_text())
          assert qa['aprovado_tecnicamente'] and len(plano)>=6
          assert len({x['gesto'] for x in plano})>=4
          print('direcao:', sorted({x['gesto'] for x in plano}))
          print('QA:',qa)
          PY
      - name: Conferir imagens e legendas no navegador
        run: node video/validate-layout.mjs saida/teste-hf/hyperframes
      - uses: actions/upload-artifact@v4
        with:
          name: nina-hyperframes-integracao-thalita
          path: |
            saida/teste-hf/teste-hf.mp4
            saida/teste-hf/voz.wav
            saida/teste-hf/capa.png
            saida/teste-hf/story.mp4
            saida/teste-hf/render.json
            saida/teste-hf/direcao.json
            saida/teste-hf/qualidade.json
            saida/teste-hf/hyperframes/layout-check.json
          retention-days: 7

