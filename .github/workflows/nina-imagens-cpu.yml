name: Validar imagens locais Nina CPU
on:
  pull_request:
    branches: [main]
    paths:
      - motor/visual_images.py
      - motor/local_story_art.py
      - tests/test_nina_imagens_cpu.py
      - .github/workflows/nina-imagens-cpu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sem-gpu-sem-custo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            motor
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - name: Testar quatro imagens Pillow sem requisicao paga
        run: python -m unittest discover -s tests -p test_nina_imagens_cpu.py -v
